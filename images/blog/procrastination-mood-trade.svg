<path d="M530.0 250.0 L537.2 258.4 L544.0 266.0 L552.0 262.0 L560.0 258.0 L567.6 262.8 L576.0 266.0 L582.4 257.0 L590.0 250.0" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M542.0 320.0 L550.9 300.9 L560.0 282.0 L570.1 301.5 L578.0 320.0" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="555" cy="226" r="1.8" fill="#243543"/><circle cx="565" cy="226" r="1.8" fill="#243543"/>
<path d="M554 236 Q560 231 566 236" fill="none" stroke="#243543" stroke-width="2" stroke-linecap="round"/>
<path d="M551.0 218.0 L553.6 219.3 L558.0 220.0" fill="none" stroke="#243543" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M562.0 220.0 L565.8 218.2 L569.0 218.0" fill="none" stroke="#243543" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="560" y="350" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="18" fill="#243543" text-anchor="middle" font-weight="bold">Future You</text>
<circle cx="250" cy="200" r="20" fill="#ebe4d7" stroke="#243543" stroke-width="2.5"/>
<text x="250" y="206" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="20" fill="#243543" text-anchor="middle" font-weight="normal">☺</text>
<text x="250" y="170" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#7c5a2b" text-anchor="middle" font-weight="normal">feel better now</text>
<rect x="440" y="150" width="90" height="90" rx="10" fill="#c9bca5" stroke="#243543" stroke-width="3"/>
<text x="485" y="200" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="16" fill="#243543" text-anchor="middle" font-weight="bold">STRESS</text>
<text x="485" y="140" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#7c5a2b" text-anchor="middle" font-weight="normal">the whole task + panic</text>
<path d="M290.0 210.0 L309.1 210.8 L328.2 210.3 L345.0 211.1 L365.3 210.2 L382.8 210.2 L401.3 210.7 L420.0 210.0" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M410 200 L424 210 L410 220" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round"/>
<text x="360" y="385" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">Procrastination is mostly mood repair: a short-term feeling fix, billed to later.</text>
</svg>
