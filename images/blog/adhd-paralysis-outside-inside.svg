<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">Outside versus inside</title>
<desc id="d">Left: a calm stick figure sitting still, captioned looks lazy. Right: the same figure with a thought bubble full of competing thoughts, captioned feels like a traffic jam.</desc>
