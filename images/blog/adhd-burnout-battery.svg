<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">Where the energy goes</title>
<desc id="d">A nearly empty battery at 4 percent, with drains labeled masking, catch-up sprints, missed reminders and shame spirals. A tired stick figure wonders why a weekend of rest did not fix it.</desc>
<rect width="720" height="400" rx="16" fill="#f5f1e8"/>
<text x="360" y="40" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="24" fill="#243543" text-anchor="middle" font-weight="bold">Where the energy goes</text>
<rect x="250" y="90" width="220" height="250" rx="18" fill="#fff" stroke="#243543" stroke-width="4"/>
<rect x="320" y="72" width="80" height="20" rx="5" fill="#243543"/>
<rect x="262" y="300" width="196" height="28" rx="6" fill="#7c5a2b"/>
<text x="360" y="320" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">4%</text>
<text x="120" y="120" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="16" fill="#7c5a2b" text-anchor="middle" font-weight="normal" font-style="italic">masking</text>
<text x="110" y="175" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="16" fill="#7c5a2b" text-anchor="middle" font-weight="normal" font-style="italic">catch-up sprints</text>
<text x="120" y="230" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="16" fill="#7c5a2b" text-anchor="middle" font-weight="normal" font-style="italic">missed reminders</text>
<text x="120" y="285" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="16" fill="#7c5a2b" text-anchor="middle" font-weight="normal" font-style="italic">shame spirals</text>
