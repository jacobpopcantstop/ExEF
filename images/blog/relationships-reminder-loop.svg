<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">The reminder loop</title>
<desc id="d">A loop of four steps: a task gets forgotten, the partner reminds, the reminder feels like nagging, tension leads to more forgetting. Two worried stick figures stand in the middle.</desc>
<rect width="720" height="400" rx="16" fill="#f5f1e8"/>
<text x="360" y="40" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="22" fill="#243543" text-anchor="middle" font-weight="bold">The reminder loop many couples fall into</text>
<ellipse cx="360" cy="210" rx="200" ry="112" fill="none" stroke="#c9bca5" stroke-width="3" stroke-dasharray="9 8"/>
<rect x="261" y="77" width="198" height="36" rx="18" fill="#fff" stroke="#243543" stroke-width="2.5"/>
<text x="360" y="101" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">A task gets forgotten</text>
<rect x="486" y="197" width="149" height="36" rx="18" fill="#fff" stroke="#243543" stroke-width="2.5"/>
<text x="560" y="221" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">Partner reminds</text>
<rect x="236" y="302" width="247" height="36" rx="18" fill="#fff" stroke="#243543" stroke-width="2.5"/>
<text x="360" y="326" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">Reminder feels like nagging</text>
<rect x="28" y="197" width="264" height="36" rx="18" fill="#fff" stroke="#243543" stroke-width="2.5"/>
<text x="160" y="221" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">Tension, then more forgetting</text>
