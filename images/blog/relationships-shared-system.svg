<text x="360" y="380" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">The board does the remembering, so neither of you has to play manager.</text>
