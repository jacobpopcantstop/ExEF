<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">A shared system</title>
<desc id="d">Two relaxed stick figures on either side of a shared board listing the week: trash on Tuesday, vet on Wednesday, the electric bill on Friday, and a 15-minute check-in on Sunday.</desc>
<rect width="720" height="400" rx="16" fill="#f5f1e8"/>
<text x="360" y="40" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="22" fill="#243543" text-anchor="middle" font-weight="bold">Move the reminders into a shared system</text>
<rect x="250" y="80" width="220" height="170" rx="10" fill="#fff" stroke="#243543" stroke-width="3"/>
<text x="360" y="108" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="17" fill="#274960" text-anchor="middle" font-weight="bold">Shared board</text>
<text x="360" y="140" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#243543" text-anchor="middle" font-weight="normal">Tue: trash out ✓</text>
<text x="360" y="166" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#243543" text-anchor="middle" font-weight="normal">Wed: vet at 4pm</text>
<text x="360" y="192" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#243543" text-anchor="middle" font-weight="normal">Fri: pay electric</text>
<text x="360" y="218" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#243543" text-anchor="middle" font-weight="normal">Sun: 15-min check-in</text>
