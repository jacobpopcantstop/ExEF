<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">Now versus not now</title>
<desc id="d">A big solid block labeled NOW next to a long faded fog labeled not now, containing tomorrow, Friday, the deadline and the distant future.</desc>
<rect width="720" height="400" rx="16" fill="#f5f1e8"/>
<text x="360" y="44" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="24" fill="#243543" text-anchor="middle" font-weight="bold">How time looks from inside some brains</text>
<rect x="60" y="80" width="170" height="150" rx="14" fill="#274960"/>
<text x="145" y="168" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="42" fill="#fff" text-anchor="middle" font-weight="bold">NOW</text>
<rect x="250" y="115" width="410" height="80" rx="14" fill="#ebe4d7" stroke="#c9bca5" stroke-width="2" stroke-dasharray="6 6"/>
<text x="455" y="151" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="24" fill="#8a7d68" text-anchor="middle" font-weight="normal" font-style="italic">not now</text>
<text x="455" y="179" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#8a7d68" text-anchor="middle" font-weight="normal">(tomorrow, Friday, the deadline, 2031… all the same fog)</text>
<circle cx="145" cy="260" r="14" fill="#f5f1e8" stroke="#243543" stroke-width="3"/>
<path d="M145.0 274.0 L144.4 294.0 L145.0 314.0" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M117.0 254.0 L132.1 270.9 L145.0 290.0 L159.5 272.0 L173.0 254.0" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M127.0 352.0 L137.0 332.1 L145.0 314.0 L154.1 333.0 L163.0 352.0" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="140" cy="257" r="1.8" fill="#243543"/><circle cx="150" cy="257" r="1.8" fill="#243543"/>
<path d="M139 264 Q145 270 151 264" fill="none" stroke="#243543" stroke-width="2" stroke-linecap="round"/>
<text x="360" y="385" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="16" fill="#243543" text-anchor="middle" font-weight="normal">If it isn't NOW, it barely registers — until it becomes NOW.</text>
</svg>
