[build]
  command = "python3 scripts/build_search_index.py"
  publish = "."
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# Redirects are evaluated top to bottom; the first match wins.
#
# WARNING: Netlify normalizes trailing slashes BEFORE matching, so a 301 whose
# target differs from its source only by a trailing slash matches its own
# target and loops forever. Four rules of exactly that shape
#   /blog                 -> /blog/
#   /coaching             -> /coaching/
#   /coaching/methodology -> /coaching/methodology/
#   /coaching/contact     -> /coaching/contact/
# are why those URLs 301'd to themselves. Never reintroduce that shape. When a
# slash variant needs to keep working, use a `status = 200` rewrite instead:
# rewrites are terminal and cannot loop.
# ---------------------------------------------------------------------------

# Force non-www. Placed first so a www request is normalized in a single hop
# and every path rule below runs against the canonical host.
[[redirects]]
  from = "https://www.exef.org/*"
  to = "https://exef.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Hard-restrict internal-only paths (return 404 even if previously indexed)
[[redirects]]
  from = "/admin*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/website-todos*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/weekly-scoreboard*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lead-tracker*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/outreach-list-template*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Retired directory-style routes -> canonical flat URLs.
#
# These paths used to be served by `status = 200` rewrites. Every link and
# asset path in this repo is document-relative (href="css/styles.css"), so a
# page served one directory deep resolved its assets to /coaching/css/... and
# rendered unstyled with every link 404ing. Flat URLs keep all pages at root
# depth, which is what those relative paths require.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/coaching/methodology"
  to = "/coaching-methodology"
  status = 301
  force = true

[[redirects]]
  from = "/coaching/contact"
  to = "/coaching-contact"
  status = 301
  force = true

[[redirects]]
  from = "/coaching/services"
  to = "/coaching-home#service-lanes"
  status = 301
  force = true

[[redirects]]
  from = "/coaching/about"
  to = "/coaching-home#support-team"
  status = 301
  force = true

[[redirects]]
  from = "/coaching"
  to = "/coaching-home"
  status = 301
  force = true

[[redirects]]
  from = "/modules/1"
  to = "/module-1"
  status = 301
  force = true

[[redirects]]
  from = "/modules/2"
  to = "/module-2"
  status = 301
  force = true

[[redirects]]
  from = "/modules/3"
  to = "/module-3"
  status = 301
  force = true

[[redirects]]
  from = "/modules/4"
  to = "/module-4"
  status = 301
  force = true

[[redirects]]
  from = "/modules/5"
  to = "/module-5"
  status = 301
  force = true

[[redirects]]
  from = "/modules/6"
  to = "/module-6"
  status = 301
  force = true

[[redirects]]
  from = "/modules/7"
  to = "/module-7"
  status = 301
  force = true

[[redirects]]
  from = "/modules/8"
  to = "/module-8"
  status = 301
  force = true

[[redirects]]
  from = "/modules/9"
  to = "/module-9"
  status = 301
  force = true

# /blog/, /search/ and /verify/ differ from their canonical URLs only by the
# trailing slash, so they CANNOT be 301'd (see the warning above). Terminal
# rewrites keep them serving 200; the canonical tag consolidates them.
[[redirects]]
  from = "/blog/"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/search/"
  to = "/search.html"
  status = 200

[[redirects]]
  from = "/verify/"
  to = "/verify.html"
  status = 200

# --- Content aliases and legacy paths (targets differ from the generic
# --- extensionless rule, so these must stay explicit and stay above it).

[[redirects]]
  from = "/coaching-services.html"
  to = "/coaching-home#service-lanes"
  status = 301
  force = true

[[redirects]]
  from = "/coaching-services"
  to = "/coaching-home#service-lanes"
  status = 301
  force = true

[[redirects]]
  from = "/coaching-about.html"
  to = "/coaching-home#support-team"
  status = 301
  force = true

[[redirects]]
  from = "/coaching-about"
  to = "/coaching-home#support-team"
  status = 301
  force = true

[[redirects]]
  from = "/module-a-neuroscience.html"
  to = "/module-1"
  status = 301

[[redirects]]
  from = "/module-b-pedagogy.html"
  to = "/module-3"
  status = 301

[[redirects]]
  from = "/module-c-interventions.html"
  to = "/module-4"
  status = 301

[[redirects]]
  from = "/methodology.html"
  to = "/coaching-methodology"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/coaching-home#service-lanes"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/coaching-contact"
  status = 301

[[redirects]]
  from = "/checkout.html"
  to = "/store"
  status = 301

[[redirects]]
  from = "/coach-directory.html"
  to = "/coaching-home"
  status = 301

# --- Canonical URL enforcement (must stay last) ----------------------------

# /index.html would otherwise become /index and 404.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Force extensionless URLs. Safe against looping: the target never ends in
# .html, so it cannot re-match this rule.
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' https://www.googletagmanager.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https://app.netlify.com https://js.stripe.com https://checkout.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
