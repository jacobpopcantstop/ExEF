<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">The procrastination trade</title>
<desc id="d">Present You holds a small token labeled feel better now and passes a large box labeled stress to a worried Future You.</desc>
<rect width="720" height="400" rx="16" fill="#f5f1e8"/>
<text x="360" y="40" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="24" fill="#243543" text-anchor="middle" font-weight="bold">Every procrastination is a trade</text>
<circle cx="170" cy="228" r="14" fill="#f5f1e8" stroke="#243543" stroke-width="3"/>
<path d="M170.0 242.0 L169.6 262.6 L170.0 282.0" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M146.0 278.0 L157.8 267.8 L170.0 258.0 L190.0 253.0 L208.0 246.0" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M152.0 320.0 L161.0 300.3 L170.0 282.0 L180.2 302.0 L188.0 320.0" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
