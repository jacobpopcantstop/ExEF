<circle cx="560" cy="236" r="5" fill="#fff" stroke="#243543" stroke-width="2"/>
<circle cx="535" cy="226" r="7" fill="#fff" stroke="#243543" stroke-width="2"/>
<text x="510.0" y="113.75" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">Do the email!</text>
<text x="510.0" y="132.5" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">No wait, first the</text>
<text x="510.0" y="151.25" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">attachment. Where is it?</text>
<text x="510.0" y="170.0" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">Also I'm hungry.</text>
<text x="510.0" y="188.75" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">WHY CAN'T I START</text>
<text x="540" y="372" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="16" fill="#7c5a2b" text-anchor="middle" font-weight="normal">(Feels like: a traffic jam.)</text>
