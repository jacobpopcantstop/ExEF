<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">Simple versus complex tasks with company</title>
<desc id="d">Left: two stick figures working on simple familiar tasks, labeled faster with company. Right: two figures on brand-new tricky tasks, labeled a bit slower when watched.</desc>
