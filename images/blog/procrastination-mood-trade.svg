<path d="M164 232 Q170 238 176 232" fill="none" stroke="#243543" stroke-width="2" stroke-linecap="round"/>
<text x="170" y="350" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="18" fill="#243543" text-anchor="middle" font-weight="bold">Present You</text>
