<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">Types of body doubling</title>
<desc id="d">A two-axis chart. Left to right runs same room and time to different place and time. Bottom to top runs quiet company to active accountability. Examples: co-working cafe, working next to a friend, video call with cameras on, study-with-me videos, and texting a buddy at start and finish.</desc>
<rect width="720" height="400" rx="16" fill="#f5f1e8"/>
<text x="360" y="36" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="22" fill="#243543" text-anchor="middle" font-weight="bold">Body doubling comes in more than one flavor</text>
