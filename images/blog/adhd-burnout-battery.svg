<circle cx="580" cy="178" r="7" fill="#fff" stroke="#243543" stroke-width="2"/>
<text x="595.0" y="120.875" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">“But I rested</text>
<text x="595.0" y="139.625" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">all weekend?”</text>
<text x="360" y="385" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#243543" text-anchor="middle" font-weight="normal">Rest refills the battery slower than the drains empty it.</text>
</svg>
