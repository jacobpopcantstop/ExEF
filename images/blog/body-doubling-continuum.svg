<path d="M110.0 330.0 L109.5 310.8 L109.0 293.7 L109.5 273.8 L111.1 255.5 L110.0 236.2 L109.4 218.2 L109.0 199.4 L109.9 182.2 L110.4 162.1 L110.3 145.5 L110.5 125.9 L109.0 106.1 L109.2 88.5 L110.0 70.0" fill="none" stroke="#243543" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="385" y="360" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#243543" text-anchor="middle" font-weight="normal">same room, same time  →  different place  →  different time</text>
<text x="96" y="110" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="13" fill="#243543" text-anchor="end" font-weight="normal">check-ins,</text>
<text x="96" y="128" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="13" fill="#243543" text-anchor="end" font-weight="normal">accountability</text>
<text x="96" y="300" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="13" fill="#243543" text-anchor="end" font-weight="normal">quiet</text>
<text x="96" y="318" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="13" fill="#243543" text-anchor="end" font-weight="normal">company</text>
<circle cx="200" cy="280" r="10" fill="#274960"/>
<text x="200" y="262" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#274960" text-anchor="middle" font-weight="normal">co-working café</text>
<circle cx="220" cy="120" r="10" fill="#274960"/>
<text x="220" y="102" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#274960" text-anchor="middle" font-weight="normal">working next to a friend</text>
<circle cx="400" cy="200" r="10" fill="#274960"/>
<text x="400" y="182" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#274960" text-anchor="middle" font-weight="normal">video call, cameras on</text>
<circle cx="590" cy="290" r="10" fill="#274960"/>
<text x="590" y="272" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#274960" text-anchor="middle" font-weight="normal">“study with me” video</text>
<circle cx="590" cy="115" r="10" fill="#274960"/>
<text x="590" y="97" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#274960" text-anchor="middle" font-weight="normal">text a buddy: start + done</text>
<text x="385" y="388" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="13" fill="#7c5a2b" text-anchor="middle" font-weight="normal">Model adapted from Eagle, Baltaxe-Admony &amp; Ringland (2023).</text>
