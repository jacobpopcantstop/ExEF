<text x="250" y="312" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="15" fill="#7c5a2b" text-anchor="middle" font-weight="normal">procrastinates</text>
<text x="560" y="104" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="16" fill="#7c5a2b" text-anchor="middle" font-weight="normal" font-style="italic">uh oh</text>
<text x="360" y="385" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',sans-serif" font-size="14" fill="#7c5a2b" text-anchor="middle" font-weight="normal">Schematic of Tice &amp; Baumeister (1997): calmer now, sicker and more stressed later.</text>
